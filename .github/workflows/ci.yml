name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  server:
    uses: bvdcode/github-workflows/.github/workflows/dotnet-checks.yml@v1
    with:
      project: src/Tusklet.slnx
      dotnet-version: 11.0.x
      run-tests: false
      postgres-project: src/Tusklet.Tests/Tusklet.Tests.csproj
      postgres-connection-variable: TUSKLET_TEST_POSTGRES

  client:
    uses: bvdcode/github-workflows/.github/workflows/node-checks.yml@v1
    with:
      node-version: '26'
      working-directory: src/tusklet.client

  container:
    name: Container smoke test
    needs: [server, client]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build container
        uses: docker/build-push-action@v7.4.0
        with:
          context: src
          file: src/Tusklet.Server/Dockerfile
          load: true
          tags: tusklet:smoke
          cache-from: type=gha,scope=docker-${{ github.ref_name }}
      - name: Verify the application from the container
        shell: bash
        run: |
          docker network create tusklet-smoke
          cookie_jar="$(mktemp)"
          trap 'if (( $? != 0 )); then docker logs tusklet-smoke; fi; rm -f -- "$cookie_jar"; docker rm -f tusklet-smoke tusklet-db; docker network rm tusklet-smoke' EXIT
          docker run --detach --name tusklet-db --network tusklet-smoke \
            --env POSTGRES_HOST_AUTH_METHOD=trust --env POSTGRES_DB=tusklet postgres:18
          for attempt in {1..20}; do
            if docker exec tusklet-db pg_isready -h 127.0.0.1 -U postgres -d tusklet; then break; fi
            sleep 1
          done
          docker exec tusklet-db pg_isready -h 127.0.0.1 -U postgres -d tusklet
          docker run --detach --name tusklet-smoke --network tusklet-smoke --publish 127.0.0.1::8080 \
            --env TUSKLET_PG_HOST=tusklet-db --env TUSKLET_PG_DATABASE=tusklet \
            --env TUSKLET_PG_USERNAME=postgres tusklet:smoke
          base_url="http://$(docker port tusklet-smoke 8080/tcp)"
          test "$(curl -fsS --retry 20 --retry-all-errors --retry-delay 1 --max-time 2 "$base_url/health")" = Healthy
          page="$(curl -fsS "$base_url/")"
          grep -Fq '<title>Tusklet</title>' <<< "$page"
          for path in profile admin; do
            test "$(curl -fsS "$base_url/$path")" = "$page"
          done
          asset="$(sed -n 's/.*src="\([^"]*\.js\)".*/\1/p' <<< "$page")"
          test -n "$asset"
          curl -fsS -o /dev/null "$base_url$asset"
          session="$(curl -fsS -c "$cookie_jar" "$base_url/api/auth/session")"
          jq -e '.setupRequired and (.user == null)' <<< "$session"
          csrf="$(jq -er '.requestToken' <<< "$session")"
          curl -fsS -o /dev/null -b "$cookie_jar" \
            -H "X-CSRF-Token: $csrf" -H 'Content-Type: application/json' \
            --data '{"username":"smoke-admin","password":"test-passphrase"}' "$base_url/api/auth/setup"
          curl -fsS "$base_url/api/auth/session" | jq -e '.setupRequired | not'
          curl -fsS "$base_url/api/counter" | jq -e '.count == 0'
          curl -fsS -X POST "$base_url/api/counter" | jq -e '.count == 1'
          curl -fsS "$base_url/api/counter" | jq -e '.count == 1'
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$base_url/api/missing")" = 404
          container_logs="$(docker logs tusklet-smoke 2>&1)"
          if grep -Eq 'Request (starting|finished)|Executed DbCommand' <<< "$container_logs"; then
            echo 'Routine HTTP or SQL messages were written to the log.'
            exit 1
          fi

  version:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [container]
    uses: bvdcode/github-workflows/.github/workflows/gitversion.yml@v1

  publish:
    needs: version
    permissions:
      contents: read
      packages: write
    uses: bvdcode/github-workflows/.github/workflows/docker-publish.yml@v1
    with:
      version: ${{ needs.version.outputs.version }}
      dockerhub-image: bvdcode/tusklet
      ghcr-image: ghcr.io/bvdcode/tusklet
      publish: true
      context: src
      file: src/Tusklet.Server/Dockerfile
      platforms: linux/amd64,linux/arm64
      build-args: BUILD_VERSION=${{ needs.version.outputs.version }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: [version, publish]
    permissions:
      contents: write
    uses: bvdcode/github-workflows/.github/workflows/release.yml@v1
    with:
      version: ${{ needs.version.outputs.version }}

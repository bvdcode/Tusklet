<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/shared/startup.css" />
    <script>
      const themeMode =
        document.cookie.match(
          /(?:^|; *)tusklet-theme=(light|dark|system)(?:;|$)/,
        )?.[1] ?? "system";
      document.documentElement.dataset.themeMode = themeMode;
      switch (themeMode) {
        case "light":
        case "dark":
          document.documentElement.dataset.colorScheme = themeMode;
          break;
        case "system":
          document.documentElement.dataset.colorScheme = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches
            ? "dark"
            : "light";
          break;
      }
    </script>
    <title>Tusklet</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="/src/shared/assets/tusklet.svg"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
